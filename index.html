<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ki Wave</title>
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ki Wave">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="touch" class="hidden">
      <div class="pad left">
        <button data-a="left">◀</button>
        <button data-a="jump">▲</button>
        <button data-a="right">▶</button>
        <button data-a="charge">▼<small>guard</small></button>
      </div>
      <div class="pad right">
        <button data-a="punch">J<small>punch</small></button>
        <button data-a="blast">K<small>blast</small></button>
        <button data-a="beam" class="big">L<small>wave</small></button>
        <button data-a="transform">T<small>form</small></button>
        <button data-a="special1" class="sp">①<small>tech</small></button>
        <button data-a="special2" class="sp">②<small>ultra</small></button>
      </div>
      <button id="pauseBtn" data-a="pause">II</button>
      <button id="fsBtn" aria-label="Fullscreen">⛶</button>
      <button id="swBtn" class="off" data-a="switch" aria-label="Switch hero">⇄</button>
    </div>
    <div id="rotate">
      <div class="phone">📱</div>
      <p>Please rotate your phone to landscape</p>
    </div>
  </div>

  <script src="src/core.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/particles.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/boss.js"></script>
  <script src="src/specials.js"></script>
  <script src="src/ally.js"></script>
  <script src="src/coins.js"></script>
  <script src="src/combat.js"></script>
  <script src="src/level.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/acts45.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
